spring.application.name=protogsm
server.servlet.context-path=/protogsm

spring.datasource.url=jdbc:mariadb://localhost:3306/protosystemintegrator
spring.datasource.username=protogsmdb
spring.datasource.password=change-me
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

spring.threads.virtual.enabled=true

protogsm.super-user.username=admin
protogsm.super-user.password=change-me

logging.level.org.springframework.security=DEBUG
